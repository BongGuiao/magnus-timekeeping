server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets never change, so cache them long-term and never fall back to index.html.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Always revalidate the HTML shell so browsers pick up new asset hashes after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
