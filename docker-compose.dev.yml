services:
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - web
      - frontend
