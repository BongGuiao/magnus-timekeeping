# 1. HTTP Server: Handles Let's Encrypt validation and redirects everything else to HTTPS
server {
    listen 80;
    server_name mbsione.com www.mbsione.com;
    server_tokens off;

    # Allow Certbot to access the challenge files for domain validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS securely
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server: Handles the actual application traffic
server {
    listen 443 ssl;
    server_name mbsione.com www.mbsione.com;
    server_tokens off;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/mbsione.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mbsione.com/privkey.pem;

    # Security settings for strong encryption
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20M;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream web:8000;
    set $frontend_upstream frontend:3000;

    # API documentation is not exposed publicly in production
    location ~ ^/(docs|redoc|openapi\.json)(/|$) {
        return 404;
    }

    # Employee face photos are served only through the authenticated /enrollment/photos endpoint
    location ^~ /static/ {
        return 404;
    }

    # Backend API Routing
    location ~ ^/(api|auth|enrollment|attendance|companies|org-units|locations|geofences|employees|employment-assignments|employee-skills|holiday-calendars|holidays|announcements|leave-types|employee-entitlements|leave-applications|leave-ledger|payroll|payroll-groups|payroll-cutoffs|schedule-templates|employee-schedule-assignments|schedule-uploads|my-schedule-assignments|emergency-schedule-requests|rest-day-patterns|devices|psgc|roles|user-roles|transactions) {
        proxy_pass http://$backend_upstream;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Frontend Routing
    location / {
        proxy_pass http://$frontend_upstream;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for React Hot-Module Replacement (HMR) if using dev server
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
