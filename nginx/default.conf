server {
    listen 80;
    server_name localhost;
    server_tokens off;

    client_max_body_size 20M;
    location ~ ^/(api|auth|enrollment|attendance|companies|org-units|locations|geofences|employees|employment-assignments|employee-skills|holiday-calendars|holidays|announcements|leave-types|employee-entitlements|leave-applications|leave-ledger|payroll-groups|payroll-cutoffs|schedule-templates|employee-schedule-assignments|rest-day-patterns|devices|psgc|roles|user-roles|transactions|docs|redoc|openapi.json) {
        proxy_pass http://web:8000;
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        proxy_pass http://frontend:3000;
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for React Hot-Module Replacement (HMR) if using dev server
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}