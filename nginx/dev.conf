server {
    listen 80;
    server_name mbsione.com www.mbsione.com _;
    server_tokens off;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    client_max_body_size 20M;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream web:8000;
    set $frontend_upstream frontend:3000;

    location ~ ^/(api|auth|enrollment|attendance|companies|org-units|operational-groups|locations|geofences|employees|employment-assignments|employee-skills|holiday-calendars|holidays|announcements|leave-types|employee-entitlements|leave-applications|leave-ledger|payroll|payroll-groups|payroll-cutoffs|schedule-templates|employee-schedule-assignments|schedule-uploads|my-schedule-assignments|emergency-schedule-requests|rest-day-patterns|devices|psgc|roles|user-roles|transactions|docs|redoc|openapi.json) {
        proxy_pass http://$backend_upstream;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        proxy_pass http://$frontend_upstream;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
